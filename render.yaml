services:
  - type: web
    name: electric-shop-web
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://electric-shop-api.onrender.com/api
      - key: VITE_SOCKET_URL
        value: https://electric-shop-api.onrender.com
    routes:
      - source: /*
        destination: /index.html
